{% load static %}

<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yangi fan qo‘shish</title>

    <link
        rel="stylesheet"
        href="{% static 'university/css/style.css' %}?v=3"
    >
</head>

<body>

<header>

    <h1>🎓 Universitet fanlari tizimi</h1>

    <nav class="navbar">

        <a
            class="nav-link"
            href="{% url 'home' %}"
        >
            🏠 Bosh sahifa
        </a>

        <a
            class="nav-link"
            href="{% url 'subject_list' %}"
        >
            📚 Fanlar
        </a>

        <a
            class="nav-link"
            href="{% url 'teacher_list' %}"
        >
            👨‍🏫 O‘qituvchilar
        </a>

    </nav>

</header>


<div class="container">

    <div class="detail-card">

        <h1 class="subject-title">
            ➕ Yangi fan qo‘shish
        </h1>


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Fan nomi
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Masalan: Python dasturlash"
                    required
                >

            </div>


            <div class="form-group">

                <label for="code">
                    Fan kodi
                </label>

                <input
                    type="text"
                    id="code"
                    name="code"
                    placeholder="Masalan: PY011"
                    required
                >

            </div>


            <div class="form-group">

                <label for="credits">
                    Kredit
                </label>

                <input
                    type="number"
                    id="credits"
                    name="credits"
                    min="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="teacher">
                    O‘qituvchi
                </label>

                <select
                    id="teacher"
                    name="teacher"
                >

                    <option value="">
                        — O‘qituvchini tanlang —
                    </option>

                    {% for teacher in teachers %}

                    <option value="{{ teacher.id }}">

                        {{ teacher.last_name }}
                        {{ teacher.first_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <button
                type="submit"
                class="detail-btn"
            >
                💾 Fanni saqlash
            </button>

        </form>


        <a
            class="back"
            href="{% url 'subject_list' %}"
        >
            ← Fanlar ro‘yxatiga qaytish
        </a>

    </div>

</div>

</body>
</html>
